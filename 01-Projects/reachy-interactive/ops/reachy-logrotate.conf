# Keep the hallway demo's stdout log from growing without bound.
# voice_chat.service uses StandardOutput=append: which holds the file open, so
# copytruncate (truncate in place) is required - a plain rotate would leave the
# service writing to the old inode. Install on the Pi:
#   sudo cp ops/reachy-logrotate.conf /etc/logrotate.d/reachy
/home/pi/reachy_logs/voice_chat.log {
    daily
    rotate 7
    maxsize 20M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
