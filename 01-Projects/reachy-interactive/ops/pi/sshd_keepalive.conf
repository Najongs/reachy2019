# DGX sshd drop-in: kill dead reverse-tunnel sessions fast.
#
# The Pi holds -R 2222/-R 8090/... reverse forwards over its ssh tunnel. When
# the Pi's wifi drops uncleanly, the DGX sshd keeps that dead session (and its
# bound ports) for up to 2 hours (tcp_keepalive_time default), so the Pi's
# retry can't rebind 2222 and ExitOnForwardFailure aborts the whole tunnel -
# including the -L 8080 broker path. Probing every 30s drops a dead peer in
# ~90s, freeing the ports for the reconnect.
#
# Install (needs sudo):
#   sudo cp ops/sshd_keepalive.conf /etc/ssh/sshd_config.d/10-reachy-keepalive.conf
#   sudo sshd -t && sudo systemctl reload ssh
ClientAliveInterval 30
ClientAliveCountMax 3
